<section class="map" aria-label="Lijnkaart">
  @if (layout().stations.length) {
    <svg [attr.viewBox]="layout().viewBox" preserveAspectRatio="xMidYMid meet">
      <path
        [attr.d]="layout().path"
        fill="none"
        [attr.stroke]="lineColor()"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      @for (station of layout().stations; track $index) {
        @if (station.terminus) {
          <circle
            [attr.cx]="station.x"
            [attr.cy]="station.y"
            r="10"
            fill="#fff"
            [attr.stroke]="lineColor()"
            stroke-width="6"
          />
        } @else {
          <line
            [attr.x1]="station.tick.x1"
            [attr.y1]="station.tick.y1"
            [attr.x2]="station.tick.x2"
            [attr.y2]="station.tick.y2"
            [attr.stroke]="lineColor()"
            stroke-width="5"
            stroke-linecap="butt"
          />
        }
        <text
          [attr.transform]="station.label.transform"
          [attr.text-anchor]="station.label.anchor"
          [attr.font-weight]="station.terminus ? 700 : 600"
        >
          {{ station.name }}
        </text>
      }
    </svg>
  } @else {
    <p class="empty">Typ een paar stationsnamen, dan verschijnt hier je lijn.</p>
  }
</section>
