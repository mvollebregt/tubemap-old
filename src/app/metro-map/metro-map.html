<section class="map" aria-label="Lijnkaart">
  @if (layout().lines.length) {
    <svg [attr.viewBox]="layout().viewBox" preserveAspectRatio="xMidYMid meet">
      @for (line of layout().lines; track $index) {
        <path
          [attr.d]="line.path"
          fill="none"
          [attr.stroke]="line.color"
          stroke-width="10"
          stroke-linecap="butt"
          stroke-linejoin="round"
        />
      }

      @for (line of layout().lines; track $index; let lineIndex = $index) {
        @for (station of line.stations; track $index) {
          @if (!isTransfer(station.name)) {
            <line
              [attr.x1]="sharedTickCoordinate(station.tick.x1, 'x', lineIndex, station)"
              [attr.y1]="sharedTickCoordinate(station.tick.y1, 'y', lineIndex, station)"
              [attr.x2]="sharedTickCoordinate(station.tick.x2, 'x', lineIndex, station)"
              [attr.y2]="sharedTickCoordinate(station.tick.y2, 'y', lineIndex, station)"
              [attr.stroke]="line.color"
              stroke-width="5"
              stroke-linecap="butt"
            />
          }
        }
      }

      @for (line of layout().lines; track $index) {
        @for (station of line.stations; track $index) {
          @if (!isTransfer(station.name)) {
            @if (!isShared(station.name) || line.orientation === 'horizontal') {
              <text
                [attr.transform]="station.label.transform"
                [attr.text-anchor]="station.label.anchor"
                font-weight="400"
              >
                @for (word of station.name.split(' '); track $index) {
                  @if ($index === 0) {
                    <tspan [attr.x]="0">{{ word }}</tspan>
                  } @else {
                    <tspan [attr.x]="0" dy="16">{{ word }}</tspan>
                  }
                }
              </text>
            }
          }
        }
      }
      @for (transfer of layout().transfers; track transfer.name) {
        <circle
          [attr.cx]="transfer.x"
          [attr.cy]="transfer.y"
          r="8"
          fill="#fff"
          stroke="#000"
          stroke-width="4"
        />
        <text
          [attr.transform]="transfer.label.transform"
          [attr.text-anchor]="transfer.label.anchor"
          font-weight="400"
        >
          @for (word of transfer.name.split(' '); track $index) {
            @if ($index === 0) {
              <tspan [attr.x]="0">{{ word }}</tspan>
            } @else {
              <tspan [attr.x]="0" dy="16">{{ word }}</tspan>
            }
          }
        </text>
      }
    </svg>
  } @else {
    <p class="empty">Typ een paar stationsnamen, dan verschijnt hier je lijn.</p>
  }
</section>
