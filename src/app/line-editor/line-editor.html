<section class="editor">
  <h1>Stationslijst</h1>
  <p class="hint">Voer stations per lijn in; scheid iedere lijn met een lege regel.</p>

  <textarea
    spellcheck="false"
    aria-label="Stationsnamen"
    [ngModel]="text()"
    (ngModelChange)="textChange.emit($event)"
  ></textarea>

  <label>
    Lijnkleur
    <select [ngModel]="lineColor()" (ngModelChange)="lineColorChange.emit($event)">
      @for (line of lines(); track line.color) {
        <option [value]="line.color">{{ line.name }}</option>
      }
    </select>
  </label>
</section>
